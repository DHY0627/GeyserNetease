name: 构建与发布

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "版本提升类型（auto = 按提交信息自动判断）"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # 跳过本 workflow 自己产生的版本提交，避免循环触发
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):')) }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（完整历史与 tags）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 计算下一个版本号
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/bump-version.sh

      - name: 构建 shadowJar
        if: steps.version.outputs.skip != 'true'
        run: |
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon --stacktrace

      - name: 提交版本变更并打 tag
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts src/main/resources/extension.yml
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin main --follow-tags

      - name: 创建 GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          gh release create "v$VERSION" \
            build/libs/GeyserNeteaseExtension.jar \
            --title "v$VERSION" \
            --notes-file "$NOTES"
